[project]
name = "the-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "dotenv>=0.9.9",
    "fastapi>=0.141.1",
    "gladiaio-sdk>=1.0.5",
    "jinja2>=3.1.6",
    "pydantic>=2.13.5",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.32",
    "requests>=2.34.2",
    "uvicorn[standard]>=0.52.4",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "httpx>=0.28",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
