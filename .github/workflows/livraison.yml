# Chaîne de livraison continue — voir docs/exploitation/CHAINE_CI_CD.md
#
# Elle est distincte de la chaîne d'intégration (tests.yml) parce qu'elle
# répond à une autre question. L'intégration demande « le code est-il juste ? » ;
# la livraison demande « le produit est-il installable par quelqu'un d'autre ? ».
# Un dépôt peut être vert et rester inlivrable.
#
# Déclencheurs : tout push sur main, toute pull request visant main, tout tag de
# version, et le lancement manuel.
name: Livraison

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: livraison-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --- 1. Empaquetage -------------------------------------------------------
  empaquetage:
    name: Construire et éprouver l'image
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Récupérer les sources
        uses: actions/checkout@v4

      - name: Préparer Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construire l'image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: assistant-devis-btp:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Une image qui se construit n'est pas une image qui démarre. On lance le
      # conteneur, on attend la sonde de santé, et on interroge deux chemins :
      # la page d'accueil, ouverte, et une route de catalogue, fermée. La
      # seconde doit répondre 401 — si elle répondait 200, l'image livrerait un
      # produit sans authentification.
      - name: Éprouver le démarrage
        run: |
          set -euo pipefail
          docker run -d --name epreuve -p 8000:8000 \
            assistant-devis-btp:${{ github.sha }}

          for _ in $(seq 1 60); do
            etat=$(docker inspect --format '{{.State.Health.Status}}' epreuve)
            [ "$etat" = "healthy" ] && break
            [ "$etat" = "unhealthy" ] && { docker logs epreuve; exit 1; }
            sleep 2
          done
          [ "$(docker inspect --format '{{.State.Health.Status}}' epreuve)" = "healthy" ] \
            || { echo "sonde de santé jamais verte"; docker logs epreuve; exit 1; }

          accueil=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/)
          ferme=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/api/catalogue/familles)
          echo "accueil=$accueil route_fermee=$ferme"
          [ "$accueil" = "200" ] || { docker logs epreuve; exit 1; }
          [ "$ferme" = "401" ] || { echo "route fermée accessible sans session"; exit 1; }

          docker rm -f epreuve

      # L'image embarque la base catalogue : on vérifie qu'elle est bien là et
      # qu'elle porte des produits, sinon l'API livrée répondrait 503.
      - name: Vérifier la base embarquée
        run: |
          docker run --rm --entrypoint python \
            assistant-devis-btp:${{ github.sha }} \
            -c "from app.catalogue_base import ouvrir; c=ouvrir(); n=c.execute('select count(*) from produit').fetchone()[0]; c.close(); print(n,'produits'); assert n > 0"

      - name: Exporter l'image comme artefact
        run: docker save assistant-devis-btp:${{ github.sha }} | gzip > image.tar.gz

      - name: Déposer l'artefact
        uses: actions/upload-artifact@v4
        with:
          name: image-${{ github.sha }}
          path: image.tar.gz
          retention-days: 7

  # --- 2. Livraison ---------------------------------------------------------
  # Elle ne s'exécute qu'après l'empaquetage éprouvé, et jamais sur une pull
  # request : on ne publie pas une proposition, on publie ce qui est entré dans
  # main.
  publication:
    name: Publier sur le registre
    needs: empaquetage
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write

    steps:
      - name: Récupérer les sources
        uses: actions/checkout@v4

      - name: Préparer Buildx
        uses: docker/setup-buildx-action@v3

      - name: S'authentifier auprès de GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Calculer les étiquettes
        id: etiquettes
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,format=long

      - name: Construire et publier
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.etiquettes.outputs.tags }}
          labels: ${{ steps.etiquettes.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
