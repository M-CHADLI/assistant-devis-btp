<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Démo — Assistant chantier BTP vocal</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: system-ui, sans-serif; margin: 0; display: flex; height: 100vh; }
  .panneau { padding: 1.2rem; overflow-y: auto; }
  .chat { flex: 1.1; display: flex; flex-direction: column; border-right: 1px solid #8883; }
  .devis-panneau { flex: 1; background: #80808010; }
  h1 { font-size: 1.1rem; margin: 0 0 .8rem; }
  .fil { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: .5rem; }
  .msg { padding: .5rem .8rem; border-radius: .6rem; max-width: 85%; white-space: pre-wrap; }
  .msg.user { align-self: flex-end; background: #2563eb; color: white; }
  .msg.assistant { align-self: flex-start; background: #80808022; }
  .msg.mention-forte { background: #dc262622; border: 1px solid #dc2626; }
  .msg.mention-simple { background: #d9770622; border: 1px solid #d97706; }
  .saisie { display: flex; gap: .5rem; padding-top: .8rem; }
  .saisie input { flex: 1; padding: .6rem; font-size: 1rem; }
  button { cursor: pointer; padding: .5rem .9rem; border: 1px solid #8886; border-radius: .4rem;
           background: #80808014; }
  button.principal { background: #2563eb; color: white; border: none; }
  table { width: 100%; border-collapse: collapse; font-size: .9rem; }
  td, th { text-align: left; padding: .35rem .3rem; border-bottom: 1px solid #8883; }
  .totaux { margin-top: .8rem; font-size: .95rem; }
  .totaux .fort { font-weight: bold; font-size: 1.05rem; }
  .barre-actions { display: flex; gap: .5rem; margin-bottom: .8rem; flex-wrap: wrap; }
  .corrections { margin-top: 1rem; font-size: .8rem; opacity: .8; }
  .vide { opacity: .6; font-style: italic; }
  .btn-supprimer { font-size: .75rem; padding: .1rem .4rem; }
  .modale-fond { position: fixed; inset: 0; background: #0008; display: flex;
                 align-items: center; justify-content: center; z-index: 10; }
  .modale-fond.masquee { display: none; }
  .modale { background: Canvas; color: CanvasText; padding: 1.2rem; border-radius: .6rem;
            width: min(420px, 90vw); border: 1px solid #8886; }
  .modale input { width: 100%; padding: .5rem; margin: .6rem 0; box-sizing: border-box; }
  .modale .actions { display: flex; justify-content: flex-end; gap: .5rem; }
</style>
</head>
<body>

<div class="panneau chat">
  <h1>🎙️ Assistant chantier — décris ton chantier</h1>
  <div class="barre-actions">
    <button id="btn-dicter">🎤 Dicter (prototype navigateur)</button>
    <button id="btn-reset">↺ Nouveau chantier</button>
  </div>
  <div class="fil" id="fil"></div>
  <div class="saisie">
    <input id="entree" type="text" placeholder="Je refais le salon, 22 m² au sol..." autofocus>
    <button class="principal" id="btn-envoyer">Envoyer</button>
  </div>
</div>

<div class="panneau devis-panneau">
  <h1>📋 Devis en cours</h1>
  <div id="devis-corps"><p class="vide">Rien encore — décris ton chantier à gauche.</p></div>
  <button class="principal" id="btn-export" style="margin-top:1rem">⬇️ Exporter en Word</button>
</div>

<div class="modale-fond masquee" id="modale-correction">
  <div class="modale">
    <p>Pourquoi corriges-tu cette ligne ?<br><small>(journalisé comme signal qualité)</small></p>
    <input id="modale-input" type="text" placeholder="ex : quantité surestimée, produit non retenu...">
    <div class="actions">
      <button id="modale-annuler">Annuler</button>
      <button class="principal" id="modale-valider">Valider la correction</button>
    </div>
  </div>
</div>

<script>
const fil = document.getElementById('fil');
const entree = document.getElementById('entree');
const devisCorps = document.getElementById('devis-corps');

function ajouterMessage(texte, classe) {
  const div = document.createElement('div');
  div.className = 'msg ' + classe;
  div.textContent = texte;
  fil.appendChild(div);
  fil.scrollTop = fil.scrollHeight;
}

function rendreDevis(devis) {
  if (!devis.lignes.length) {
    devisCorps.innerHTML = '<p class="vide">Rien encore — décris ton chantier à gauche.</p>';
    return;
  }
  let html = '<table><tr><th>Poste</th><th>Qté</th><th>PU HT</th><th>Total HT</th><th></th></tr>';
  devis.lignes.forEach((l, i) => {
    html += `<tr>
      <td>${l.designation}${l.origine === 'consommable' ? ' <small>(consommable)</small>' : ''}</td>
      <td>${l.quantite} ${l.unite}</td>
      <td>${l.prix_unitaire_ht.toFixed(2)} €</td>
      <td>${l.prix_ht.toFixed(2)} €</td>
      <td><button class="btn-supprimer" onclick="corrigerLigne(${i})">✕</button></td>
    </tr>`;
  });
  html += '</table>';
  html += '<div class="totaux">';
  html += `<div>Total HT : ${devis.total_ht.toFixed(2)} €</div>`;
  for (const [taux, montant] of Object.entries(devis.ventilation_tva)) {
    html += `<div>TVA ${taux}% : ${montant.toFixed(2)} €</div>`;
  }
  html += `<div class="fort">Total TTC : ${devis.total_ttc.toFixed(2)} €</div>`;
  html += `<div>Acompte 30% : ${devis.acompte_30_pct.toFixed(2)} €</div>`;
  html += '</div>';
  if (devis.mentions.length) {
    html += `<p><strong>Mentions :</strong> ${devis.mentions.join(', ')}</p>`;
  }
  if (devis.corrections.length) {
    html += '<div class="corrections"><strong>Corrections artisan (signal qualité) :</strong><ul>';
    devis.corrections.forEach(c => {
      html += `<li>${c.horodatage} — ${c.description}</li>`;
    });
    html += '</ul></div>';
  }
  devisCorps.innerHTML = html;
}

const modaleFond = document.getElementById('modale-correction');
const modaleInput = document.getElementById('modale-input');
let indexLigneEnCorrection = null;

function corrigerLigne(index) {
  indexLigneEnCorrection = index;
  modaleInput.value = '';
  modaleFond.classList.remove('masquee');
  modaleInput.focus();
}

async function validerCorrection() {
  const description = modaleInput.value.trim();
  if (!description) { modaleInput.focus(); return; }
  modaleFond.classList.add('masquee');
  const resp = await fetch('/api/corriger', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({index: indexLigneEnCorrection, description})
  });
  const data = await resp.json();
  rendreDevis(data.devis);
  ajouterMessage('Correction artisan appliquée : ' + description, 'assistant');
}

document.getElementById('modale-valider').onclick = validerCorrection;
document.getElementById('modale-annuler').onclick = () => modaleFond.classList.add('masquee');
modaleInput.addEventListener('keydown', e => { if (e.key === 'Enter') validerCorrection(); });

async function envoyer() {
  const texte = entree.value.trim();
  if (!texte) return;
  ajouterMessage(texte, 'user');
  entree.value = '';
  const resp = await fetch('/api/message', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({texte})
  });
  const data = await resp.json();
  data.messages.forEach(m => {
    let classe = 'assistant';
    if (m.startsWith('⚠️')) classe += ' mention-forte';
    else if (m.toLowerCase().includes('vigilance')) classe += ' mention-simple';
    ajouterMessage(m, classe);
  });
  if (Object.keys(data.consommables_suggeres || {}).length) {
    let texteConso = 'Ne pas oublier : ';
    for (const [lot, items] of Object.entries(data.consommables_suggeres)) {
      texteConso += items.join(', ') + '. ';
    }
    ajouterMessage(texteConso, 'assistant');
  }
  rendreDevis(data.devis);
}

document.getElementById('btn-envoyer').onclick = envoyer;
entree.addEventListener('keydown', e => { if (e.key === 'Enter') envoyer(); });

document.getElementById('btn-reset').onclick = async () => {
  await fetch('/api/reset', {method: 'POST'});
  fil.innerHTML = '';
  rendreDevis({lignes: [], total_ht: 0, ventilation_tva: {}, total_ttc: 0, acompte_30_pct: 0, mentions: [], corrections: []});
};

document.getElementById('btn-export').onclick = () => {
  window.location.href = '/api/export';
};

// Resynchronisation au chargement : le devis vit côté serveur, un rechargement
// de page ne doit pas donner l'impression qu'il a disparu.
fetch('/api/devis').then(r => r.json()).then(data => rendreDevis(data.devis));

// Dictée — prototype navigateur (Web Speech API), pas le STT local de production
// (docs/CADRAGE_MODELE.md §2 prévoit un Whisper local sur la DGX Spark). Ici,
// c'est un raccourci pour démontrer la capture vocale sans construire tout le
// pipeline audio → serveur → Whisper dans cette session.
const btnDicter = document.getElementById('btn-dicter');
const Reco = window.SpeechRecognition || window.webkitSpeechRecognition;
if (!Reco) {
  btnDicter.disabled = true;
  btnDicter.title = "Dictée non supportée par ce navigateur";
} else {
  const reco = new Reco();
  reco.lang = 'fr-FR';
  reco.interimResults = false;
  let enCours = false;
  reco.onresult = (e) => {
    entree.value = e.results[0][0].transcript;
  };
  reco.onend = () => { enCours = false; btnDicter.textContent = '🎤 Dicter (prototype navigateur)'; };
  btnDicter.onclick = () => {
    if (enCours) { reco.stop(); return; }
    enCours = true;
    btnDicter.textContent = '⏺ Écoute...';
    reco.start();
  };
}
</script>
</body>
</html>
